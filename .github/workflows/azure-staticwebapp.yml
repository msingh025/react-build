# This workflow will build and push a web application to an Azure Static Web App when you change your code.
#
# This workflow assumes you have already created the target Azure Static Web App.
# For instructions see https://docs.microsoft.com/azure/static-web-apps/get-started-portal?tabs=vanilla-javascript
#
# To configure this workflow:
#
# 1. Set up a secret in your repository named AZURE_STATIC_WEB_APPS_API_TOKEN with the value of your Static Web Apps deployment token.
#    For instructions on obtaining the deployment token see: https://docs.microsoft.com/azure/static-web-apps/deployment-token-management
#
# 3. Change the values for the APP_LOCATION, API_LOCATION and APP_ARTIFACT_LOCATION, AZURE_STATIC_WEB_APPS_API_TOKEN environment variables (below).
#    For instructions on setting up the appropriate configuration values go to https://docs.microsoft.com/azure/static-web-apps/front-end-frameworks
name: Deploy web app to Azure Static Web Apps
on:
  push:
    branches: [ "dev" ]
    paths:
      - "/"  # Only trigger on changes to the build directory
      - ".github/workflows/azure-staticwebapp.yml" # Only trigger on changes to this workflow file

# Environment variables available to all jobs and steps in this workflow
env:
  APP_LOCATION: "/" # location of your client code
  API_LOCATION: "api" # location of your api source code - optional
  APP_ARTIFACT_LOCATION: "build/" # location of client code build output
  AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }} # secret containing deployment token for your static web app

permissions:
  contents: read

jobs:
  build_and_deploy_job:
    permissions:
      contents: read # for actions/checkout to fetch code
      pull-requests: write # for Azure/static-web-apps-deploy to comment on PRs
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true 
      - name: unzip
        run: |
          echo "Unzipping the build directory"
          unzip -o build.zip
          cp -rf build/*  .
          rm  build.zip
          rm -rf build

      - name: List files
        run: |
          echo "Files in the repository:"
          ls -R
      - name: Start ClamAV Daemon
        uses: github-actions/clamav-daemon@v1
      - name: Malware Scanner
        uses: internxt/scan@v1
        with:
              directories: .
              options: -ri
              
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN }} # secret containing api token for app
         # repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          #skip_app_build: true

          ###### Repository/Build Configurations - These values can be configured to match you app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: ${{ env.APP_ARTIFACT_LOCATION }}
          ###### End of Repository/Build Configurations ######
          output_location: ${{ env.APP_ARTIFACT_LOCATION }}
  verify_http_status_job:
    needs: build_and_deploy_job
    permissions:
      contents: none
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Verify HTTP Status Job
    steps:
      - name:  Wait for 30 seconds
        run: sleep 30
      - name:  verify http status
        run: |
          echo "Verifying the HTTP status of the static web app"
          echo "github.owner: ${{ github.repository_owner }}"
          echo "github.repo: ${{ github.repository }}"
          echo "github.event_name: ${{ github.event_name }}"
          echo "github.event.action: ${{ github.event.action }}"
          echo "Verifying the HTTP status of the static web app"
          curl -I https://www.pkchai.com | grep HTTP
          if [ $? -ne 0 ]; then
            echo "Failed to verify HTTP status"
            exit 1
          else
            echo "HTTP status verified successfully" 
          fi
  close_pull_request_job:
    permissions:
      contents: none
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN }} # secret containing api token for app
          action: "close"
      - name:  Wait for 30 seconds
        run: sleep 30
      
      